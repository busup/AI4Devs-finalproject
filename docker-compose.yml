# =============================================================
# Route Searcher — Local Development  |  docker-compose.yml
#
# Usage:
#   cp .env.example .env   # fill in credentials
#   docker compose up
#
# Services:
#   mysql                 — MySQL 8.0 with both microservice DBs
#   flyway-router         — Applies ms-router migrations
#   flyway-planifications — Applies ms-planifications migrations
#   ms-router             — Laravel 11 / PHP 8.3 (port 8001)
#   ms-planifications     — Laravel 11 / PHP 8.3 (port 8002)
# =============================================================

services:

  # -----------------------------------------------------------
  # MySQL 8
  # -----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: route_searcher_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Init script creates both databases and dedicated users
      # on first container start (skipped if data volume exists).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Use 127.0.0.1 (TCP) instead of localhost (Unix socket) so the
      # check only passes once MySQL is actually listening on port 3306.
      # During the init phase MySQL runs a temporary server on socket
      # only (port 0), causing a false-positive with localhost.
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-P"
        - "3306"
        - "-u"
        - "root"
        - "-p${MYSQL_ROOT_PASSWORD}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - route_searcher_net

  # -----------------------------------------------------------
  # Flyway — ms-router
  # Runs once, exits 0 on success.  Re-runs are no-ops.
  # -----------------------------------------------------------
  flyway-router:
    image: flyway/flyway:10
    container_name: flyway_ms_router
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    command:
      - migrate
      - -url=jdbc:mysql://mysql:3306/${ROUTER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - -user=${ROUTER_DB_USER}
      - -password=${ROUTER_DB_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - -baselineOnMigrate=true
    volumes:
      - ./ms-router/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - route_searcher_net

  # -----------------------------------------------------------
  # Flyway — ms-planifications
  # -----------------------------------------------------------
  flyway-planifications:
    image: flyway/flyway:10
    container_name: flyway_ms_planifications
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    command:
      - migrate
      - -url=jdbc:mysql://mysql:3306/${PLANIFICATIONS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - -user=${PLANIFICATIONS_DB_USER}
      - -password=${PLANIFICATIONS_DB_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - -baselineOnMigrate=true
    volumes:
      - ./ms-planifications/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - route_searcher_net

  # -----------------------------------------------------------
  # ms-router — Laravel 11 / PHP 8.3
  # Geographic source of truth: Stops, Routes, Snapshots
  # Port on host: MS_ROUTER_PORT (default 8001)
  # -----------------------------------------------------------
  ms-router:
    build:
      context: ./ms-router
      dockerfile: ../docker/ms-router/Dockerfile
    container_name: ms_router_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      flyway-router:
        condition: service_completed_successfully
    env_file: .env
    environment:
      APP_NAME: "ms-router"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${MS_ROUTER_APP_KEY}"
      APP_URL: "http://localhost:${MS_ROUTER_PORT:-8001}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${ROUTER_DB_NAME}"
      DB_USERNAME: "${ROUTER_DB_USER}"
      DB_PASSWORD: "${ROUTER_DB_PASSWORD}"
      PLANIFICATIONS_SERVICE_URL: "http://ms-planifications:8000"
    ports:
      - "${MS_ROUTER_PORT:-8001}:8000"
    volumes:
      # Mount source for live-reload during development.
      - ./ms-router:/var/www/html
      # Named volume for vendor dir: avoids host overwriting the
      # container-built vendor on every bind-mount refresh.
      - ms_router_vendor:/var/www/html/vendor
    networks:
      - route_searcher_net

  # -----------------------------------------------------------
  # ms-planifications — Laravel 11 / PHP 8.3
  # Expeditions, planifications and concrete service instances
  # Port on host: MS_PLANIFICATIONS_PORT (default 8002)
  # -----------------------------------------------------------
  ms-planifications:
    build:
      context: ./ms-planifications
      dockerfile: ../docker/ms-planifications/Dockerfile
    container_name: ms_planifications_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      flyway-planifications:
        condition: service_completed_successfully
      ms-router:
        condition: service_started
    env_file: .env
    environment:
      APP_NAME: "ms-planifications"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${MS_PLANIFICATIONS_APP_KEY}"
      APP_URL: "http://localhost:${MS_PLANIFICATIONS_PORT:-8002}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${PLANIFICATIONS_DB_NAME}"
      DB_USERNAME: "${PLANIFICATIONS_DB_USER}"
      DB_PASSWORD: "${PLANIFICATIONS_DB_PASSWORD}"
      # ms-planifications calls ms-router to validate RouteSnapshot refs
      ROUTER_SERVICE_URL: "http://ms-router:8000"
    ports:
      - "${MS_PLANIFICATIONS_PORT:-8002}:8000"
    volumes:
      - ./ms-planifications:/var/www/html
      - ms_planifications_vendor:/var/www/html/vendor
    networks:
      - route_searcher_net

# -------------------------------------------------------------
# Volumes
# -------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  ms_router_vendor:
    driver: local
  ms_planifications_vendor:
    driver: local

# -------------------------------------------------------------
# Networks
# -------------------------------------------------------------
networks:
  route_searcher_net:
    driver: bridge
