# API Gateway - Development local
# Exposes port 8080, routes /api/v1/* to corresponding microservices

events {
    worker_connections 1024;
}

http {
    upstream search_service {
        server search-service:3004;
    }
    upstream sites_service {
        server sites-service:3001;
    }
    upstream routes_service {
        server routes-service:8000;
    }
    upstream booking_service {
        server booking-service:3002;
    }
    upstream rates_service {
        server rates-service:3005;
    }

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 10M;

        # Search Service
        location /api/v1/search {
            proxy_pass http://search_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sites Service
        location /api/v1/sites {
            proxy_pass http://sites_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routes Service
        location /api/v1/routes {
            proxy_pass http://routes_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Booking Service
        location /api/v1/bookings {
            proxy_pass http://booking_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rates Service
        location /api/v1/rates {
            proxy_pass http://rates_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
